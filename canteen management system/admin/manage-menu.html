<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eco Plate Admin - Menu Management</title>
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="css/manage-menu.css">
</head>
<body>
<header>
    <div class="logo"><h1>Eco Plate Admin</h1></div>
    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="manage-menu.html">Menu Management</a>
        <a href="manage-orders.html">Orders Management</a>
        <a href="manage-users.html">Users</a>
        <a href="#" id="logout">Logout</a>
    </nav>
</header>

<section class="menu-management container">
    <h2>Menu Management</h2>
    <button id="addNewItemBtn">Add New Item</button>

    <!-- Add/Edit Form -->
    <div id="itemFormContainer" class="hidden">
        <h3 id="formTitle">Add New Item</h3>
        <form id="itemForm">
            <label for="itemName">Name</label>
            <input type="text" id="itemName" placeholder="Item Name" required>

            <label for="itemPrice">Price (₹)</label>
            <input type="number" id="itemPrice" placeholder="Price" required>

            <label for="itemCategory">Category</label>
            <select id="itemCategory" required>
                <option value="Drinks">Drinks</option>
                <option value="Snacks">Snacks</option>
                <option value="Main Course">Main Course</option>
            </select>

            <label for="itemImage">Image URL</label>
            <input type="text" id="itemImage" placeholder="Image URL" required>

            <button type="submit" id="saveItemBtn">Save</button>
            <button type="button" id="cancelBtn">Cancel</button>
        </form>
    </div>

    <div id="menuTableContainer">
        <table id="menuTable">
            <thead>
                <tr>
                    <th>Image</th>
                    <th>Name</th>
                    <th>Price (₹)</th>
                    <th>Category</th>
                    <th>Edit</th>
                    <th>Delete</th>
                </tr>
            </thead>
            <tbody>
                <!-- Menu items populated by JS -->
            </tbody>
        </table>
    </div>
</section>

<div class="toast" id="toast"></div>
<script src="js/adminMenu.js"></script>
</body>
</html>
